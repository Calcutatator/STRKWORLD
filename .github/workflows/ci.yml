name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-invariants.sh
      - run: ./scripts/check-tilemaps.sh

  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22.12 is the repository floor (D-025). CI said 20, which is the
          # exact mismatch D-025 was written to stop: AVNU SDK 4.2.0 requires
          # Node 22 and Vite supports Node 22 from 22.12.
          node-version: '22.12'
          cache: npm
      # ci, not install — reproducible from the committed lockfile.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deployment-builds:
    name: Deployment typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      # deploy/ is intentionally outside npm workspaces, so the root scripts
      # do not reach either production composition config.
      - name: Typecheck Fly composition
        run: npx tsc --noEmit -p deploy/fly/tsconfig.build.json
      - name: Typecheck standalone backend image
        run: npx tsc --noEmit -p deploy/backend/tsconfig.build.json
      # Both Dockerfiles require the repository root as their build context.
      # The Fly value is public browser configuration, not a credential.
      - name: Build Fly composition image
        run: >-
          docker build
          --file deploy/fly/Dockerfile
          --tag strkworld-fly:ci
          --build-arg VITE_LOBBY_URL=wss://ci.example.com
          .
      - name: Build standalone backend image
        run: >-
          docker build
          --file deploy/backend/Dockerfile
          --tag strkworld-backend:ci
          .

  headers:
    name: No cross-origin isolation headers (D-005)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Builds apps/web for production, serves the real artifact, and asserts
    # the responses carry no isolation headers — and that no config file
    # introduces them. They break web wallets and the failure is silent, so
    # this gate is the only thing that would catch it before players do.
    # D-005 asks for exactly this: "a comment and a header test".
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: node scripts/check-headers.mjs

  drift:
    name: Protocol drift canary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only mainnet asserts. The pool fee has already moved once (4 -> 6
    # STRK) and the docs did not follow; this catches the next one.
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-drift.sh
