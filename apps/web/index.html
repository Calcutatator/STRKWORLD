<!doctype html>
<!--
  Build entry point for `vite build`. Added by the deployment lane because a
  production build (and therefore the D-005 header test) needs an entry module;
  the Shell lane owns the real markup and should replace the body freely.

  Do not add a <meta http-equiv> cross-origin isolation policy here, and do not
  ask the host to send one. It breaks the postMessage popups and cross-origin
  iframes web wallets rely on, and we do no in-browser proving. See
  docs/DECISIONS.md D-005; enforced by scripts/check-headers.mjs.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>STRKWORLD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
